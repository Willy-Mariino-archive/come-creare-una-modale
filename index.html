<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>come creare una modale</title>

    <!-- React via CDN -->

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <!-- ReactDOM -->
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel (JSX support in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        const { useState } = React

        // Componente Modal: rappresenta la finestra modale. (componente figlio)
        // Riceve le props:
        // - title: titolo da mostrare nella modale
        // - content: contenuto testuale della modale
        // - show: booleano che determina se la modale è visibile
        // - onClose: funzione chiamata quando si clicca il bottone di chiusura
        function Modal({
            title = "Qui verrà mostrato il titolo della Modale ricevuto tramite prop",
            content = "Questo  sarà il contenuto della modale",
            show = false,
            onClose = () => { }
        }) {
            // Se show è false, la modale non viene renderizzata.
            return show && (
                <div className="modal-container">
                    {/* Struttura della modale */}
                    <div className="modal">
                        <h2>{title}</h2>
                        <p>{content}</p>
                        {/* Bottone per chiudere la modale, richiama la funzione onClose */}
                        <button onClick={onClose}>close</button>
                    </div>
                </div>
            )
        }

        // Componente principale dell'applicazione React (componente genitore, praticamente come se fosse app.jsx)
        const ReactApp = () => {

            // Stato locale per gestire la visibilità della modale
            const [show, setShow] = useState(false)

            return (
                <main>
                    <h1>Applicazione React con modale</h1>

                    {/* Bottone che apre la modale impostando show a true */}
                    <button onClick={() => setShow(true)}>
                        open
                    </button>

                    <section>
                        <h2>section title</h2>

                        {/* Inserimento del componente Modal.
                        - title: titolo personalizzato
                        - content: testo della modale
                        - show: stato che determina se la modale è visibile
                        - onClose: funzione che chiude la modale (imposta show a false)
                       */}
                        <Modal
                            title="il mio titolo preferito"
                            content="contenuto della modale"
                            show={show}
                            onClose={() => setShow(false)}
                        />
                    </section>

                    <a href="versione_con_details.html">versione con details</a>

                </main>
            )
        }

        const { createRoot } = ReactDOM

        const elementoSpecifico = document.querySelector(".elemento-specifico")

        const root = createRoot(elementoSpecifico)
        root.render(<ReactApp />)
    </script>

</head>

<body>

    <div class="elemento-specifico">

    </div>

</body>

</html>
