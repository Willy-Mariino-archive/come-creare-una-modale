<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React senza Vite</title>

    <!-- React via CDN -->

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <!-- ReactDOM -->
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel (JSX support in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        const { useState } = React

        function Modal({
            title = "titolo Modale",
            content = "Questo è il contenuto della modale",
            show = false,
            oncClose = () => { }
        }) {
            return show && (
                <div className="modal-container">

                    <div className="modal">
                        <h2>{title}</h2>
                        <p>{content}</p>
                        <button onClick={onClose}>close</button>
                    </div>

                </div>

            )
        }

        const ReactApp = () => {

            const [show, setShow] = useState(false)

            return (
                <main>
                    <h1>Apllicazione React</h1>
                    <p>count: {count}</p>

                    <button onClick={() => setShow(true)}>
                        open
                    </button>

                    <section>
                        <h2>section title</h2>
                    </section>
                    <Modal
                        title="il mio titolo preferito"
                        content="contenuto della modale"
                        show={show}
                        oncClose={() => setShow(false)}
                    />

                </main>

            )
        }

        const { createRoot } = ReactDOM

        const elementoSpecifico = document.querySelector(".elemento-specifico")

        const root = createRoot(elementoSpecifico)
        root.render(<ReactApp />)
    </script>

</head>

<body>

    <div class="elemento-specifico">

    </div>

</body>

</html>
